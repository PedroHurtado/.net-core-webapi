<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar | Fudie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#FF4F5A',
                        primaryDark: '#E63E49',
                        secondary: '#1F2937',
                        light: '#F9FAFB',
                        surface: '#FFFFFF'
                    },
                    boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar Simple -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <a href="public.html" class="font-bold text-xl tracking-tight">fudie<span
                    class="text-primary">.demo</span></a>
            <div class="text-sm text-gray-500">Paso 3 de 4</div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-3xl bg-white rounded-3xl shadow-soft overflow-hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-100 h-1.5">
                <div class="bg-primary h-1.5 rounded-r-full" style="width: 75%"></div>
            </div>

            <div class="p-8 md:p-12">
                <!-- Current Selection Summary -->
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl mb-8 border border-gray-100">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary shadow-sm">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-bold uppercase">Tu Reserva</p>
                            <p class="font-bold text-sm">Vie, 05 Dic • 21:15 • 4 Personas</p>
                        </div>
                    </div>
                    <a href="reserva-step2.html"
                        class="text-sm font-bold text-primary hover:text-primaryDark">Cambiar</a>
                </div>

                <div class="max-w-xl mx-auto">
                    <h2 class="text-2xl font-bold mb-2 text-center">Tus Datos</h2>
                    <p class="text-gray-500 text-center mb-8">Necesitamos tus datos para confirmar la reserva.</p>

                    <form class="space-y-5">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Nombre completo <span
                                    class="text-primary">*</span></label>
                            <input type="text" placeholder="Ej. Juan Pérez"
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                                required>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Email <span
                                        class="text-primary">*</span></label>
                                <input type="email" placeholder="juan@ejemplo.com"
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                                    required>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Teléfono <span
                                        class="text-primary">*</span></label>
                                <input type="tel" placeholder="+34 600 000 000"
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                                    required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Comentarios (Opcional)</label>
                            <textarea rows="3" placeholder="Alergias, mesa especial, celebración..."
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all resize-none"></textarea>
                        </div>

                        <div class="flex items-start gap-3 p-4 bg-gray-50 rounded-xl">
                            <input type="checkbox" id="terms"
                                class="mt-1 w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                            <label for="terms" class="text-sm text-gray-600">
                                Acepto la <a href="#" class="text-primary font-bold hover:underline">política de
                                    cancelación</a>. Cancelación gratuita hasta 2 horas antes de la reserva.
                            </label>
                        </div>
                    </form>

                    <div class="mt-10 flex gap-4">
                        <a href="reserva-step2.html"
                            class="flex-1 py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors text-center">
                            Atrás
                        </a>
                        <a href="reserva-step4.html"
                            class="flex-[2] bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-glow transition-all text-center flex items-center justify-center gap-2">
                            Continuar <i class="fas fa-arrow-right text-sm"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
