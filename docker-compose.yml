name: fudie

services:
  firebase:
    image: andreysenov/firebase-tools
    command: firebase emulators:start --project demo-project
    ports:
      - "4000:4000"  # UI
      - "8080:8080"  # Firestore
    volumes:
      - ./firebase.json:/home/node/firebase.json
    working_dir: /home/node

  auth-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Auth/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - ${USER_SECRETS_PATH:-~/.microsoft/usersecrets}:/home/appuser/.microsoft/usersecrets:ro

  menus-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Menus/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080

  plan-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Plan/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080

  schedules-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Schedules/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080

  customers-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Customers/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080

  gateway:
    platform: linux/amd64
    build:
      context: ./src/Fudie.Gateway
      dockerfile: Dockerfile
    ports:
      - "5176:8080"
    depends_on:
      - auth-service
      - menus-service
      - plan-service
      - schedules-service
      - customers-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://auth-service:8080
      - ReverseProxy__Clusters__menus-cluster__Destinations__destination1__Address=http://menus-service:8080
      - ReverseProxy__Clusters__plan-cluster__Destinations__destination1__Address=http://plan-service:8080
      - ReverseProxy__Clusters__schedules-cluster__Destinations__destination1__Address=http://schedules-service:8080
      - ReverseProxy__Clusters__customers-cluster__Destinations__destination1__Address=http://customers-service:8080
    volumes:
      - ./src/Fudie.Gateway/appsettings.json:/app/appsettings.json:ro
      - ./src/Fudie.Gateway/DevPortal.html:/app/DevPortal.html:ro