services:
  firebase:
    image: andreysenov/firebase-tools
    command: firebase emulators:start --project demo-project
    ports:
      - "4000:4000"  # UI
      - "8080:8080"  # Firestore
    volumes:
      - ./firebase.json:/home/node/firebase.json
    working_dir: /home/node

  auth-service:
    build:
      context: ..
      dockerfile: webapi/src/Auth/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development      
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/appuser/.microsoft/usersecrets:ro

  gateway:
    build:
      context: ./src/Fudie.Gateway
      dockerfile: Dockerfile
    ports:
      - "5176:8080"
    depends_on:
      - auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://auth-service:8080