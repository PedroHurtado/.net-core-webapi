name: fudie

volumes:
  user-secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${USER_SECRETS_PATH:-~/.microsoft/usersecrets}

services:
  firebase:
    image: andreysenov/firebase-tools
    command: firebase emulators:start --project demo-project
    ports:
      - "4000:4000"  # UI
      - "8080:8080"  # Firestore
    volumes:
      - ./firebase.json:/home/node/firebase.json
    working_dir: /home/node

  auth-service:

    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Auth/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - user-secrets:/home/appuser/.microsoft/usersecrets:ro

  menus-service:

    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Menus/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - user-secrets:/home/appuser/.microsoft/usersecrets:ro

  plan-service:

    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Plan/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - user-secrets:/home/appuser/.microsoft/usersecrets:ro

  schedules-service:

    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Schedules/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - user-secrets:/home/appuser/.microsoft/usersecrets:ro

  customers-service:

    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Customers/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - user-secrets:/home/appuser/.microsoft/usersecrets:ro

  subscriptions-service:

    build:
      context: ..
      dockerfile: ${PROJECT_DIR:-webapi}/src/Subscriptions/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-webapi}
        FIRESTORE_DIR: ${FIRESTORE_DIR:-Firestore}
    depends_on:
      - firebase
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Firestore__EmulatorHost=firebase:8080
    volumes:
      - user-secrets:/home/appuser/.microsoft/usersecrets:ro

  gateway:

    build:
      context: ./src/Fudie.Gateway
      dockerfile: Dockerfile
    ports:
      - "5176:8080"
    depends_on:
      - auth-service
      - menus-service
      - plan-service
      - schedules-service
      - customers-service
      - subscriptions-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      - ./src/Fudie.Gateway/appsettings.json:/app/appsettings.json:ro
      - ./src/Fudie.Gateway/DevPortal.html:/app/DevPortal.html:ro
