<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios | Fudie Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#FF4F5A',
                        primaryDark: '#E63E49',
                        secondary: '#1F2937',
                        light: '#F9FAFB',
                        surface: '#FFFFFF'
                    },
                    boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-gray-900 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col hidden md:flex">
        <div class="h-20 flex items-center px-8 border-b border-gray-50">
            <span class="font-bold text-2xl tracking-tight">fudie<span class="text-primary">.admin</span></span>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
            <a href="admin.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all">
                <i class="fas fa-home w-5"></i> Dashboard
            </a>
            <a href="admin-schedule.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/5 text-primary font-bold">
                <i class="fas fa-clock w-5"></i> Horarios
            </a>
            <a href="admin-services.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all">
                <i class="fas fa-utensils w-5"></i> Servicios
            </a>
            <a href="admin-menus.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/5 text-primary font-bold">
                <i class="fas fa-book-open w-5"></i> Menús
            </a>
            <a href="admin-policy.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all">
                <i class="fas fa-cog w-5"></i> Políticas
            </a>
        </nav>

        <div class="p-4 border-t border-gray-50">
            <div class="flex items-center gap-3 px-4 py-3">
                <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <p class="text-sm font-bold">Admin User</p>
                    <p class="text-xs text-gray-400">Restaurante Demo</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Mobile -->
        <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-4 md:hidden">
            <span class="font-bold text-xl">fudie<span class="text-primary">.admin</span></span>
            <button class="text-gray-500"><i class="fas fa-bars"></i></button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Horarios de Apertura</h1>
                        <p class="text-gray-500">Configura los turnos semanales del restaurante.</p>
                    </div>
                    <div class="flex bg-white rounded-xl p-1 shadow-sm border border-gray-100">
                        <a href="admin-schedule.html"
                            class="px-4 py-2 rounded-lg bg-gray-900 text-white text-sm font-bold shadow-md">Semana
                            Regular</a>
                        <a href="admin-schedule-special.html"
                            class="px-4 py-2 rounded-lg text-gray-500 hover:text-gray-900 text-sm font-medium transition-colors">Fechas
                            Especiales</a>
                    </div>
                </div>

                <div class="space-y-6">
                    <!-- Monday -->
                    <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-lg w-24">Lunes</span>
                                <span
                                    class="px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold">ABIERTO</span>
                            </div>
                            <button class="text-sm text-primary font-bold hover:underline">+ Añadir Turno</button>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <span class="text-gray-400 text-xs font-bold uppercase w-16">Turno 1</span>
                                <div class="flex items-center gap-2">
                                    <input type="time" value="13:00"
                                        class="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none">
                                    <span class="text-gray-400">-</span>
                                    <input type="time" value="16:00"
                                        class="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none">
                                </div>
                                <button class="ml-auto text-gray-400 hover:text-red-500 transition-colors"><i
                                        class="fas fa-trash"></i></button>
                            </div>

                            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <span class="text-gray-400 text-xs font-bold uppercase w-16">Turno 2</span>
                                <div class="flex items-center gap-2">
                                    <input type="time" value="20:00"
                                        class="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none">
                                    <span class="text-gray-400">-</span>
                                    <input type="time" value="23:00"
                                        class="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none">
                                </div>
                                <button class="ml-auto text-gray-400 hover:text-red-500 transition-colors"><i
                                        class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Tuesday -->
                    <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-lg w-24">Martes</span>
                                <span
                                    class="px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold">ABIERTO</span>
                            </div>
                            <button class="text-sm text-primary font-bold hover:underline">+ Añadir Turno</button>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <span class="text-gray-400 text-xs font-bold uppercase w-16">Turno 1</span>
                                <div class="flex items-center gap-2">
                                    <input type="time" value="13:00"
                                        class="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none">
                                    <span class="text-gray-400">-</span>
                                    <input type="time" value="16:00"
                                        class="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none">
                                </div>
                                <button class="ml-auto text-gray-400 hover:text-red-500 transition-colors"><i
                                        class="fas fa-trash"></i></button>
                            </div>
                            <!-- ... More shifts ... -->
                        </div>
                    </div>

                    <!-- Sunday (Closed) -->
                    <div class="bg-gray-50 p-6 rounded-3xl border border-gray-200 opacity-75">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-lg w-24 text-gray-500">Domingo</span>
                                <span
                                    class="px-3 py-1 rounded-full bg-gray-200 text-gray-600 text-xs font-bold">CERRADO</span>
                            </div>
                            <button class="text-sm text-primary font-bold hover:underline">Abrir este día</button>
                        </div>
                    </div>

                </div>

                <!-- Floating Action Bar -->
                <div class="fixed bottom-6 right-6 md:right-10 flex gap-4">
                    <button
                        class="bg-white text-gray-700 px-6 py-3 rounded-full font-bold shadow-lg border border-gray-100 hover:bg-gray-50 transition-all">Cancelar</button>
                    <button
                        class="bg-primary text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-primaryDark hover:shadow-glow transition-all flex items-center gap-2">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>

            </div>
        </main>
    </div>

</body>

</html>
