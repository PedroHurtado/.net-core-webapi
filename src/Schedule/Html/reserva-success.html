<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Confirmada | Fudie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#FF4F5A',
                        primaryDark: '#E63E49',
                        secondary: '#1F2937',
                        light: '#F9FAFB',
                        surface: '#FFFFFF'
                    },
                    boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar Simple -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <a href="public.html" class="font-bold text-xl tracking-tight">fudie<span
                    class="text-primary">.demo</span></a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-xl bg-white rounded-3xl shadow-soft overflow-hidden text-center p-8 md:p-12">

            <div
                class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-green-500 text-4xl mx-auto mb-6 animate-bounce">
                <i class="fas fa-check"></i>
            </div>

            <h1 class="text-3xl font-bold mb-2 text-gray-900">¡Reserva Confirmada!</h1>
            <p class="text-gray-500 mb-8">Te esperamos con la mesa lista.</p>

            <div class="bg-gray-50 rounded-2xl p-6 border border-gray-100 mb-8 text-left">
                <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200">
                    <span class="text-sm text-gray-500 uppercase font-bold">Código</span>
                    <span class="font-mono font-bold text-lg text-primary">#R-8392</span>
                </div>
                <div class="space-y-3">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-calendar text-gray-400 w-5"></i>
                        <span class="font-medium">Viernes, 05 Diciembre 2025</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="fas fa-clock text-gray-400 w-5"></i>
                        <span class="font-medium">21:15 (Cena)</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="fas fa-user-friends text-gray-400 w-5"></i>
                        <span class="font-medium">4 Personas</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="fas fa-map-marker-alt text-gray-400 w-5"></i>
                        <span class="font-medium">Calle Mayor 123, Madrid</span>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <button
                    class="w-full bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-glow transition-all flex items-center justify-center gap-2">
                    <i class="fab fa-google"></i> Añadir a Google Calendar
                </button>
                <a href="public.html"
                    class="block w-full py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors">
                    Volver al Inicio
                </a>
            </div>

        </div>
    </main>
</body>

</html>
