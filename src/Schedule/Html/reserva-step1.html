<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar | Fudie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#FF4F5A',
                        primaryDark: '#E63E49',
                        secondary: '#1F2937',
                        light: '#F9FAFB',
                        surface: '#FFFFFF'
                    },
                    boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar Simple -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <a href="public.html" class="font-bold text-xl tracking-tight">fudie<span
                    class="text-primary">.demo</span></a>
            <div class="text-sm text-gray-500">Paso 1 de 4</div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-3xl bg-white rounded-3xl shadow-soft overflow-hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-100 h-1.5">
                <div class="bg-primary h-1.5 rounded-r-full" style="width: 25%"></div>
            </div>

            <div class="p-8 md:p-12">
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-bold mb-2">¿Cuándo nos visitas?</h1>
                    <p class="text-gray-500">Selecciona el día y el número de personas para tu reserva.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                    <!-- Calendar Section -->
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold text-lg">Diciembre 2025</h3>
                            <div class="flex gap-2">
                                <button
                                    class="w-8 h-8 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-600 transition-colors"><i
                                        class="fas fa-chevron-left text-xs"></i></button>
                                <button
                                    class="w-8 h-8 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-600 transition-colors"><i
                                        class="fas fa-chevron-right text-xs"></i></button>
                            </div>
                        </div>

                        <div class="grid grid-cols-7 gap-2 text-center mb-2">
                            <span class="text-xs font-bold text-gray-400 uppercase">L</span>
                            <span class="text-xs font-bold text-gray-400 uppercase">M</span>
                            <span class="text-xs font-bold text-gray-400 uppercase">X</span>
                            <span class="text-xs font-bold text-gray-400 uppercase">J</span>
                            <span class="text-xs font-bold text-gray-400 uppercase">V</span>
                            <span class="text-xs font-bold text-gray-400 uppercase">S</span>
                            <span class="text-xs font-bold text-gray-400 uppercase">D</span>
                        </div>

                        <div class="grid grid-cols-7 gap-2">
                            <!-- Empty days -->
                            <span></span><span></span><span></span>

                            <!-- Days -->
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-400">1</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-400">2</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-400">3</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-400">4</button>

                            <!-- Selected Day -->
                            <button
                                class="aspect-square rounded-xl bg-primary text-white shadow-lg shadow-primary/30 flex items-center justify-center text-sm font-bold transform scale-110">5</button>

                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">6</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">7</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">8</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">9</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">10</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">11</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">12</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">13</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">14</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">15</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">16</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">17</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">18</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">19</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">20</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">21</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">22</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">23</button>

                            <!-- Disabled Days -->
                            <button
                                class="aspect-square rounded-xl bg-gray-50 text-gray-300 cursor-not-allowed flex items-center justify-center text-sm font-medium">24</button>
                            <button
                                class="aspect-square rounded-xl bg-gray-50 text-gray-300 cursor-not-allowed flex items-center justify-center text-sm font-medium">25</button>

                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">26</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">27</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">28</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">29</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">30</button>
                            <button
                                class="aspect-square rounded-xl hover:bg-gray-50 flex items-center justify-center text-sm font-medium text-gray-700">31</button>
                        </div>

                        <div class="mt-6 p-4 bg-blue-50 rounded-2xl flex items-center gap-3 text-blue-800 text-sm">
                            <i class="fas fa-info-circle text-blue-500"></i>
                            <span class="font-medium">Viernes, 05 Diciembre 2025</span>
                        </div>
                    </div>

                    <!-- People Selector Section (Moved from step 2) -->
                    <div class="flex flex-col justify-center">
                        <h3 class="font-bold text-lg mb-6">¿Cuántos sois?</h3>

                        <div class="grid grid-cols-4 gap-3 mb-4">
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">1</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">2</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">3</button>
                            <button
                                class="aspect-square rounded-2xl bg-primary text-white shadow-lg shadow-primary/30 flex items-center justify-center font-bold text-lg transform scale-105">4</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">5</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">6</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">7</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">8</button>
                        </div>
                        <p class="text-xs text-gray-400 text-center">Para grupos de +8, por favor llámanos.</p>
                        

                        <div class="mt-10 flex gap-4">
                            <a href="public.html"
                                class="flex-1 py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors text-center">
                                Cancelar
                            </a>
                            <a href="reserva-step2.html"
                                class="flex-[2] bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-glow transition-all text-center flex items-center justify-center gap-2">
                                Continuar <i class="fas fa-arrow-right text-sm"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
