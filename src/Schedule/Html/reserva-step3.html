<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar - Paso 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #c41e3a;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: #c41e3a;
            width: 75%;
        }

        .step-info {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .current-selection {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #c41e3a;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        label .required {
            color: #c41e3a;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #c41e3a;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-top: 4px;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #c41e3a;
            color: white;
        }

        .btn-primary:hover {
            background: #a01729;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>📅 Hacer una Reserva</h1>
            <div class="step-info">
                Paso 3 de 4: Tus datos de contacto
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="current-selection">
                <strong>Reserva para:</strong> Viernes 05 Diciembre 2025 - 🍷 CENA - 21:15
                <br>
                <strong>4 personas</strong> |
                <a href="reserva-step2.html" style="color: #c41e3a; text-decoration: none; font-size: 0.9rem;">←
                    Cambiar</a>
            </div>

            <h2>👤 Tus Datos</h2>

            <form>
                <div class="form-group">
                    <label>
                        Nombre completo <span class="required">*</span>
                    </label>
                    <input type="text" name="name" placeholder="Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label>
                        Email <span class="required">*</span>
                    </label>
                    <input type="email" name="email" placeholder="juan.perez@email.com" required>
                </div>

                <div class="form-group">
                    <label>
                        Teléfono <span class="required">*</span>
                    </label>
                    <input type="tel" name="phone" placeholder="+34 612 345 678" required>
                </div>

                <div class="form-group">
                    <label>
                        Comentarios o peticiones especiales (opcional)
                    </label>
                    <textarea name="comments" placeholder="Mesa cerca de la ventana si es posible"></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        Acepto la política de cancelación (Cancelación gratuita hasta 2h antes)
                    </label>
                </div>
            </form>

            <div class="button-group">
                <a href="reserva-step2.html" class="btn btn-secondary">← Atrás</a>
                <a href="reserva-step4.html" class="btn btn-primary">Siguiente →</a>
            </div>
        </div>
    </div>
</body>

</html>
