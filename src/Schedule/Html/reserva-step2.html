<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar | Fudie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#FF4F5A',
                        primaryDark: '#E63E49',
                        secondary: '#1F2937',
                        light: '#F9FAFB',
                        surface: '#FFFFFF'
                    },
                    boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar Simple -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <a href="public.html" class="font-bold text-xl tracking-tight">fudie<span
                    class="text-primary">.demo</span></a>
            <div class="text-sm text-gray-500">Paso 2 de 4</div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-3xl bg-white rounded-3xl shadow-soft overflow-hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-100 h-1.5">
                <div class="bg-primary h-1.5 rounded-r-full" style="width: 50%"></div>
            </div>

            <div class="p-8 md:p-12">
                <!-- Current Selection Summary (Updated to reflect Step 1 changes: Date + People) -->
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl mb-8 border border-gray-100">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary shadow-sm">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-bold uppercase">Tu Reserva</p>
                            <p class="font-bold text-sm">Vie, 05 Dic 2025 • 4 Personas</p>
                        </div>
                    </div>
                    <a href="reserva-step1.html"
                        class="text-sm font-bold text-primary hover:text-primaryDark">Cambiar</a>
                </div>

                <!-- Time Selector (Main Content) -->
                <div class="w-full">
                    <h2 class="text-2xl font-bold mb-6 text-center">¿A qué hora?</h2>
                    
                    <!-- Time Legend -->
                    <div class="flex items-center justify-center gap-4 text-xs text-gray-400 mb-8">
                        <div class="flex items-center gap-1">
                            <div class="w-2 h-2 rounded-full bg-gray-200"></div> Libre
                        </div>
                        <div class="flex items-center gap-1">
                            <div class="w-2 h-2 rounded-full bg-yellow-400"></div> Pocas mesas
                        </div>
                        <div class="flex items-center gap-1">
                            <div class="w-2 h-2 rounded-full bg-primary"></div> Seleccionado
                        </div>
                    </div>
                    
                    <!-- Service Slots (Franjas de servicio) -->
                    
                    <!-- Desayuno (Breakfast) -->
                    <div class="mb-8 p-6 bg-white border border-gray-100 rounded-2xl shadow-sm">
                        <h3 class="text-xl font-bold text-secondary mb-4 flex items-center gap-3">
                            <i class="fas fa-mug-hot text-amber-500"></i> Desayuno
                        </h3>
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">09:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">09:30</button>
                            <button
                                class="py-3 rounded-xl border border-yellow-400 bg-yellow-50 text-yellow-700 font-medium text-sm transition-all relative overflow-hidden">
                                10:00
                                <div class="absolute top-0 right-0 w-2 h-2 bg-yellow-400 rounded-full m-1"></div>
                            </button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">10:30</button>
                            <button
                                class="py-3 rounded-xl bg-gray-50 text-gray-300 cursor-not-allowed font-medium text-sm border border-transparent">11:00</button>
                            <button
                                class="py-3 rounded-xl bg-gray-50 text-gray-300 cursor-not-allowed font-medium text-sm border border-transparent">11:30</button>
                        </div>
                    </div>

                    <!-- Comida (Lunch) -->
                    <div class="mb-8 p-6 bg-white border border-gray-100 rounded-2xl shadow-sm">
                        <h3 class="text-xl font-bold text-secondary mb-4 flex items-center gap-3">
                            <i class="fas fa-utensils text-orange-500"></i> Comida
                        </h3>
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">13:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">13:30</button>
                            <button
                                class="py-3 rounded-xl bg-primary text-white font-bold text-sm shadow-lg shadow-primary/30 transform scale-105">14:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">14:30</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">15:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">15:30</button>
                        </div>
                    </div>

                    <!-- Cena (Dinner) -->
                    <div class="p-6 bg-white border border-gray-100 rounded-2xl shadow-sm">
                        <h3 class="text-xl font-bold text-secondary mb-4 flex items-center gap-3">
                            <i class="fas fa-wine-glass-alt text-purple-500"></i> Cena
                        </h3>
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">20:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">20:30</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">21:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">21:30</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">22:00</button>
                            <button
                                class="py-3 rounded-xl bg-gray-50 text-gray-300 cursor-not-allowed font-medium text-sm border border-transparent">22:30</button>
                        </div>
                    </div>

                </div>

                <div class="mt-12 flex gap-4">
                    <a href="reserva-step1.html"
                        class="flex-1 py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors text-center">
                        Atrás
                    </a>
                    <a href="reserva-step3.html"
                        class="flex-[2] bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-glow transition-all text-center flex items-center justify-center gap-2">
                        Continuar <i class="fas fa-arrow-right text-sm"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
