<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar | Fudie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#FF4F5A',
                        primaryDark: '#E63E49',
                        secondary: '#1F2937',
                        light: '#F9FAFB',
                        surface: '#FFFFFF'
                    },
                    boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar Simple -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <a href="public.html" class="font-bold text-xl tracking-tight">fudie<span
                    class="text-primary">.demo</span></a>
            <div class="text-sm text-gray-500">Paso 2 de 4</div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-3xl bg-white rounded-3xl shadow-soft overflow-hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-100 h-1.5">
                <div class="bg-primary h-1.5 rounded-r-full" style="width: 50%"></div>
            </div>

            <div class="p-8 md:p-12">
                <!-- Current Selection Summary -->
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl mb-8 border border-gray-100">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary shadow-sm">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-bold uppercase">Tu Reserva</p>
                            <p class="font-bold text-sm">Vie, 05 Dic 2025 • Cena</p>
                        </div>
                    </div>
                    <a href="reserva-step1.html"
                        class="text-sm font-bold text-primary hover:text-primaryDark">Cambiar</a>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">

                    <!-- People Selector -->
                    <div>
                        <h2 class="text-2xl font-bold mb-6">¿Cuántos sois?</h2>
                        <div class="grid grid-cols-4 gap-3 mb-4">
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">1</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">2</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">3</button>
                            <button
                                class="aspect-square rounded-2xl bg-primary text-white shadow-lg shadow-primary/30 flex items-center justify-center font-bold text-lg transform scale-105">4</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">5</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">6</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">7</button>
                            <button
                                class="aspect-square rounded-2xl border-2 border-gray-100 hover:border-primary/50 hover:bg-primary/5 flex items-center justify-center font-bold text-lg transition-all">8</button>
                        </div>
                        <p class="text-xs text-gray-400 text-center">Para grupos de +8, por favor llámanos.</p>
                    </div>

                    <!-- Time Selector -->
                    <div>
                        <h2 class="text-2xl font-bold mb-6">¿A qué hora?</h2>
                        <div class="grid grid-cols-3 gap-3 mb-6">
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">20:00</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">20:15</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">20:30</button>
                            <button
                                class="py-3 rounded-xl border border-yellow-400 bg-yellow-50 text-yellow-700 font-medium text-sm transition-all relative overflow-hidden">
                                20:45
                                <div class="absolute top-0 right-0 w-2 h-2 bg-yellow-400 rounded-full m-1"></div>
                            </button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">21:00</button>
                            <button
                                class="py-3 rounded-xl bg-primary text-white font-bold text-sm shadow-lg shadow-primary/30 transform scale-105">21:15</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">21:30</button>
                            <button
                                class="py-3 rounded-xl border border-gray-200 hover:border-primary hover:text-primary font-medium text-sm transition-all">21:45</button>
                            <button
                                class="py-3 rounded-xl bg-gray-50 text-gray-300 cursor-not-allowed font-medium text-sm border border-transparent">22:00</button>
                        </div>

                        <div class="flex items-center justify-center gap-4 text-xs text-gray-400">
                            <div class="flex items-center gap-1">
                                <div class="w-2 h-2 rounded-full bg-gray-200"></div> Libre
                            </div>
                            <div class="flex items-center gap-1">
                                <div class="w-2 h-2 rounded-full bg-yellow-400"></div> Pocas mesas
                            </div>
                            <div class="flex items-center gap-1">
                                <div class="w-2 h-2 rounded-full bg-primary"></div> Seleccionado
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-12 flex gap-4">
                    <a href="reserva-step1.html"
                        class="flex-1 py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors text-center">
                        Atrás
                    </a>
                    <a href="reserva-step3.html"
                        class="flex-[2] bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-glow transition-all text-center flex items-center justify-center gap-2">
                        Continuar <i class="fas fa-arrow-right text-sm"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
