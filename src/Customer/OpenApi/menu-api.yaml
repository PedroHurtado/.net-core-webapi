        name:
          type: string
          maxLength: 100
          example: Carta Principal
          description: Nombre del menú
        description:
          type: string
          maxLength: 500
          nullable: true
          example: Nuestra carta de toda la vida
          description: Descripción del menú
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          example: '2025-12-01T00:00:00Z'
          description: Fecha de inicio de vigencia
        effectiveUntil:
          type: string
          format: date-time
          nullable: true
          example: '2025-12-31T23:59:59Z'
          description: Fecha de fin de vigencia

    UpdateMenuRequest:
      type: object
      required:
        - name
        - displayOrder
      properties:
        name:
          type: string
          maxLength: 100
          example: Carta Principal Actualizada
        description:
          type: string
          maxLength: 500
          nullable: true
          example: Nueva descripción del menú
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveUntil:
          type: string
          format: date-time
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
          example: 1

    SetDepositPolicyRequest:
      type: object
      required:
        - depositType
        - amount
      properties:
        depositType:
          $ref: '#/components/schemas/DepositType'
        amount:
          type: number
          format: decimal
          minimum: 0
          example: 15
          description: Importe base (para PerPerson y FixedAmount)
        percentage:
          type: number
          format: decimal
          minimum: 1
          maximum: 100
          nullable: true
          example: 20
          description: Porcentaje (requerido para PercentageOfBill)
        minimumBillForDeposit:
          type: number
          format: decimal
          minimum: 0
          nullable: true
          example: 100
          description: Importe mínimo de cuenta para aplicar fianza
        minimumGuestsForDeposit:
          type: integer
          minimum: 1
          nullable: true
          example: 6
          description: Número mínimo de comensales para aplicar fianza

    AddCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Entrantes
          description: Nombre de la categoría (único dentro del menú)
        description:
          type: string
          maxLength: 500
          nullable: true
          example: Primeros platos y aperitivos
        displayOrder:
          type: integer
          minimum: 0
          default: 0
          example: 1
          description: Orden de visualización

    UpdateCategoryRequest:
      type: object
      required:
        - name
        - displayOrder
      properties:
        name:
          type: string
          maxLength: 100
          example: Entrantes Fríos
        description:
          type: string
          maxLength: 500
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
          example: 1

    PriceOptionData:
      type: object
      required:
        - portionType
      properties:
        portionType:
          $ref: '#/components/schemas/PortionType'
        price:
          type: number
          format: decimal
          minimum: 0
          nullable: true
          example: 14.00
          description: Precio (null para MarketPrice)
        isActive:
          type: boolean
          default: true
          example: true

    AddItemToCategoryRequest:
      type: object
      required:
        - menuItemId
      properties:
        menuItemId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: ID del MenuItem a añadir
        displayOrder:
          type: integer
          minimum: 0
          default: 0
          example: 1
