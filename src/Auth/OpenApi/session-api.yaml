openapi: 3.0.3
info:
  title: Fudie Auth Service — Session API
  description: |
    Endpoints del agregado Session del servicio de Auth.

    El servicio de Auth gestiona la autenticación y genera JWT efímeros por request.
    La sesión es el vínculo entre la cookie opaca del navegador y la identidad del usuario.

    **Endpoints internos:**
    - `POST /auth/resolve` — solo lo llama el gateway. No está expuesto al exterior.
    - `GET /auth/jwks` — público, consumido por microservicios al arrancar.

    **Endpoints de usuario:**
    - `PUT /auth/sessions/tenant` — establece el restaurante activo.
  version: 1.0.0

servers:
  - url: 'http://localhost:5176'
    description: Development
  - url: 'https://api-staging.fudie.com'
    description: Staging
  - url: 'https://api.fudie.com'
    description: Production

tags:
  - name: Session
    description: Gestión del contexto de tenant en la sesión
  - name: Auth
    description: Resolución de autenticación y distribución de clave pública

paths:

  # ──────────────────────────────────────────────
  # Session
  # ──────────────────────────────────────────────

  /auth/sessions/tenant:
    put:
      tags:
        - Session
      summary: Establecer contexto de tenant
      description: |
        Establece el restaurante activo en la sesión. La slice recibe solo el `TenantId`,
        internamente carga la Membership (userId + tenantId), obtiene el rol, y extrae
        los permisos para denormalizarlos en la sesión.

        También permite cambiar de tenant si el usuario tiene múltiples Memberships.

        La sesión se identifica a partir de la cookie `fudie_session` (no se pasa el ID en la ruta).
      operationId: setTenantContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTenantContextRequest'
      responses:
        '204':
          description: Contexto de tenant establecido
        '401':
          description: Sesión inválida o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomProblemDetails'
              examples:
                invalidSession:
                  summary: Sesión inválida
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: Invalid session
                sessionExpired:
                  summary: Sesión expirada
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: Session expired
        '403':
          description: Sin acceso al tenant solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomProblemDetails'
              example:
                type: 'about:blank'
                title: Forbidden
                status: 403
                detail: Membership not found for this tenant
        '422':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomProblemDetails'
              example:
                type: 'about:blank'
                title: Validation Error
                status: 422
                detail: One or more validation errors occurred.
                errors:
                  RoleId:
                    - RoleId is required when TenantId is set

  # ──────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────

  /auth/resolve:
    post:
      tags:
        - Auth
      summary: Resolver autenticación y generar JWT efímero
      description: |
        **Endpoint interno — solo lo llama el gateway.**

        El gateway reenvía la request original del cliente (con cookies incluidas).
        El servicio de Auth valida la identidad, verifica que el usuario y la membership
        estén activos, refresca la sesión (sliding expiration) y devuelve el JWT efímero
        en el header `X-Auth-Token`.

        El gateway inyecta el JWT como header `Authorization: Bearer {token}` al reenviar
        la request al microservicio destino.

        **Flujo con cookie:**
        1. Extrae sessionId de la cookie `fudie_session`
        2. Busca la sesión en Firestore
        3. Valida que no esté expirada (si lo está, elimina la sesión)
        4. Ejecuta Session.Refresh (sliding expiration)
        5. Verifica que el usuario esté activo
        6. Si hay contexto de tenant, verifica que la membership esté activa
        7. Construye JWT efímero desde los datos de la sesión
      operationId: resolveAuth
      responses:
        '204':
          description: JWT efímero generado y devuelto en el header `X-Auth-Token`
          headers:
            X-Auth-Token:
              description: JWT efímero firmado con ES256 (vida útil ~45 segundos)
              schema:
                type: string
                example: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Autenticación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomProblemDetails'
              examples:
                noCredentials:
                  summary: Sin credenciales
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: Authentication required
                invalidSession:
                  summary: Sesión inválida
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: Invalid session
                sessionExpired:
                  summary: Sesión expirada (la sesión se elimina automáticamente)
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: Session expired
                userInactive:
                  summary: Usuario desactivado por la plataforma
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: User is inactive
                membershipInactive:
                  summary: Membership inactiva para el tenant activo
                  value:
                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: Membership is inactive

  /auth/jwks:
    get:
      tags:
        - Auth
      summary: Obtener claves públicas (JWKS)
      description: |
        Endpoint estándar JWKS. Los microservicios descargan la clave pública de aquí
        al arrancar y la cachean para validar las firmas de los JWT efímeros.

        Soporta rotación de claves mediante el campo `kid` — se puede publicar la clave
        nueva junto a la anterior durante la transición.

        **Recomendaciones para microservicios:**
        - Cachear al arrancar y refrescar periódicamente (ej: cada hora).
        - Configurar `ClockSkew` de 5 segundos en `TokenValidationParameters`.
        - Usar `IssuerSigningKeyResolver` apuntando a esta URL.
      operationId: getJwks
      security: []
      responses:
        '200':
          description: JWKS con claves públicas ES256
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
              example:
                keys:
                  - kty: EC
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                    kid: auth-key-001
                    use: sig
                    alg: ES256

components:

  # ──────────────────────────────────────────────
  # Schemas
  # ──────────────────────────────────────────────

  schemas:

    # ──────────────────────────────────────────────
    # Requests
    # ──────────────────────────────────────────────

    SetTenantContextRequest:
      type: object
      required:
        - tenantId
      properties:
        tenantId:
          type: string
          format: uuid
          description: Identificador del restaurante (tenant) a activar
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    # ──────────────────────────────────────────────
    # Responses
    # ──────────────────────────────────────────────

    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'

    JwkKey:
      type: object
      required:
        - kty
        - crv
        - x
        - 'y'
        - kid
        - use
        - alg
      properties:
        kty:
          type: string
          description: Tipo de clave
          enum:
            - EC
        crv:
          type: string
          description: Curva elíptica
          enum:
            - P-256
        x:
          type: string
          description: Coordenada X de la clave pública (Base64url)
        'y':
          type: string
          description: Coordenada Y de la clave pública (Base64url)
        kid:
          type: string
          description: Identificador de la clave (para rotación)
          example: auth-key-001
        use:
          type: string
          description: Uso de la clave
          enum:
            - sig
        alg:
          type: string
          description: Algoritmo de firma
          enum:
            - ES256

    # ──────────────────────────────────────────────
    # Errors
    # ──────────────────────────────────────────────

    CustomProblemDetails:
      type: object
      properties:
        type:
          type: string
          default: 'about:blank'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
